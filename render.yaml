services:
  - type: web            # main.py opens a health-check port; use "worker" on a paid plan
    name: elina-music
    runtime: python
    plan: free
    buildCommand: pip install -U -r requirements.txt
    startCommand: python3 main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - {key: API_ID, sync: false}
      - {key: API_HASH, sync: false}
      - {key: BOT_TOKEN, sync: false}
      - {key: OWNER_ID, sync: false}
      - {key: AUTH_USER, sync: false}
      - {key: SUPPORT_CHAT_URL, sync: false}
      - {key: SUPPORT_CHANNEL_URL, sync: false}
      - {key: OWNER_URL, sync: false}
      - {key: FIREBASE_URL, sync: false}
      - {key: FIREBASE_SECRET, sync: false}
      - {key: STRING_SESSION, sync: false}
      - {key: MUSIC_API_URL, sync: false}
      - {key: MUSIC_API_KEY, sync: false}
